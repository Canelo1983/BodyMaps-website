name: Apply iterative nnInteractive refinement

on:
  push:
    branches:
      - feature/nninteractive-annotation-improvements

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[nninteractive-iterative]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nninteractive-annotation-improvements
          fetch-depth: 0

      - name: Apply safe iterative positive-prompt patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Backend predictor: keep interactions across prompts for the same
          # target, but allow the caller to explicitly reset when target changes.
          p = Path('flask-server/services/nninteractive_predictor.py')
          s = p.read_text()
          old = '''def predict(\n    ct: np.ndarray,\n    case_key: str,\n    point_ijk=None,\n    box_ijk=None,\n) -> np.ndarray:\n    session = _get_session()\n    _ensure_volume_loaded(ct, case_key)\n    session.reset_interactions()\n\n    if point_ijk is not None:\n        session.add_point_interaction(list(point_ijk), include_interaction=True)\n'''
          new = '''def predict(\n    ct: np.ndarray,\n    case_key: str,\n    point_ijk=None,\n    box_ijk=None,\n    reset_interactions: bool = False,\n) -> np.ndarray:\n    session = _get_session()\n    _ensure_volume_loaded(ct, case_key)\n    if reset_interactions:\n        session.reset_interactions()\n        if _target_buffer is not None:\n            _target_buffer.fill(0)\n\n    if point_ijk is not None:\n        session.add_point_interaction(list(point_ijk), include_interaction=True)\n'''
          if old not in s:
              raise SystemExit('nninteractive_predictor anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Model-agnostic seam: propagate reset request.
          p = Path('flask-server/services/advanced_analysis.py')
          s = p.read_text()
          old = '''                point_ijk=seed if box_ijk is None else None,\n                box_ijk=box_ijk,\n            )'''
          new = '''                point_ijk=seed if box_ijk is None else None,\n                box_ijk=box_ijk,\n                reset_interactions=bool(prompt.get("reset_interactions", False)),\n            )'''
          if old not in s:
              raise SystemExit('advanced_analysis predictor call anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Frontend request contract: tell backend when a new target starts.
          p = Path('PanTS-Demo/src/helpers/CornerstoneNifti2.tsx')
          s = p.read_text()
          old = '''export interface InteractivePrompt {\n  pointLps: Point3;\n  boxLps?: [Point3, Point3];\n  tolerance?: number;\n}\n'''
          new = '''export interface InteractivePrompt {\n  pointLps: Point3;\n  boxLps?: [Point3, Point3];\n  tolerance?: number;\n  resetInteractions?: boolean;\n}\n'''
          if old not in s:
              raise SystemExit('InteractivePrompt interface anchor not found')
          s = s.replace(old, new, 1)
          old = '''  if (prompt.tolerance != null) body.tolerance = prompt.tolerance;\n\n  const httpRes = await fetch'''
          new = '''  if (prompt.tolerance != null) body.tolerance = prompt.tolerance;\n  body.reset_interactions = prompt.resetInteractions ?? false;\n\n  const httpRes = await fetch'''
          if old not in s:
              raise SystemExit('Cornerstone request body anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Tool behavior: first prompt for each case/resolution/segment resets
          # the remote interaction state; later prompts refine the same mask.
          # Keep the AI tool armed after success so the user can add prompts.
          p = Path('PanTS-Demo/src/helpers/viewer/useInteractivePromptTool.ts')
          s = p.read_text()
          old = '''\tconst paneRef = useRef<CinePane | null>(null);\n\tconst busyRef = useRef(false);\n'''
          new = '''\tconst paneRef = useRef<CinePane | null>(null);\n\tconst busyRef = useRef(false);\n\tconst interactionKeyRef = useRef<string | null>(null);\n'''
          if old not in s:
              raise SystemExit('useInteractivePromptTool ref anchor not found')
          s = s.replace(old, new, 1)

          old = '''\t\ttry {\n\t\t\tconst changed = await submitInteractiveSegmentPrompt(\n\t\t\t\tapiBase,\n\t\t\t\tcaseId,\n\t\t\t\tactiveSegmentIndex,\n\t\t\t\t{ pointLps: pointWorld, boxLps: boxWorld, tolerance },\n\t\t\t\tres,\n\t\t\t);\n'''
          new = '''\t\ttry {\n\t\t\tconst interactionKey = `${caseId}:${res}:${activeSegmentIndex}`;\n\t\t\tconst resetInteractions = interactionKeyRef.current !== interactionKey;\n\t\t\tconst changed = await submitInteractiveSegmentPrompt(\n\t\t\t\tapiBase,\n\t\t\t\tcaseId,\n\t\t\t\tactiveSegmentIndex,\n\t\t\t\t{ pointLps: pointWorld, boxLps: boxWorld, tolerance, resetInteractions },\n\t\t\t\tres,\n\t\t\t);\n'''
          if old not in s:
              raise SystemExit('useInteractivePromptTool submit anchor not found')
          s = s.replace(old, new, 1)

          old = '''\t\t\tif (changed) {\n\t\t\t\tconst msg = `Interactive segment (${changed.toLocaleString()} vox)`;\n'''
          new = '''\t\t\tif (changed) {\n\t\t\t\tinteractionKeyRef.current = interactionKey;\n\t\t\t\tconst msg = `Interactive segment (${changed.toLocaleString()} vox)`;\n'''
          if old not in s:
              raise SystemExit('useInteractivePromptTool success anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('\t\t\t\tonComplete?.();\n', '', 1)
          p.write_text(s)

          # Make the iterative behavior visible in the toolbar copy.
          p = Path('PanTS-Demo/src/components/viewer/AnnotationToolbar.tsx')
          s = p.read_text()
          old = '{ id: "pointSegment", label: "AI Point", Icon: IconPoint, description: "Segment from a single interactive point prompt." },'
          new = '{ id: "pointSegment", label: "AI Point", Icon: IconPoint, description: "Add interactive AI point prompts to refine the current mask iteratively." },'
          if old not in s:
              raise SystemExit('AnnotationToolbar AI Point anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Review patch
        run: |
          git diff --check
          git diff -- flask-server/services/nninteractive_predictor.py flask-server/services/advanced_analysis.py PanTS-Demo/src/helpers/CornerstoneNifti2.tsx PanTS-Demo/src/helpers/viewer/useInteractivePromptTool.ts PanTS-Demo/src/components/viewer/AnnotationToolbar.tsx

      - name: Install frontend dependencies
        working-directory: PanTS-Demo
        run: npm ci

      - name: Type-check frontend
        working-directory: PanTS-Demo
        run: npm run typecheck

      - name: Compile-check Python changes
        run: python3 -m py_compile flask-server/services/nninteractive_predictor.py flask-server/services/advanced_analysis.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flask-server/services/nninteractive_predictor.py \
                  flask-server/services/advanced_analysis.py \
                  PanTS-Demo/src/helpers/CornerstoneNifti2.tsx \
                  PanTS-Demo/src/helpers/viewer/useInteractivePromptTool.ts \
                  PanTS-Demo/src/components/viewer/AnnotationToolbar.tsx
          git commit -m "[nninteractive-iterative] Preserve positive prompt state safely"
          git push origin HEAD:feature/nninteractive-annotation-improvements
